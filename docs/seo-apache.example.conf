# REVIEW ONLY. Merge into the PUBLIC site's existing .htaccess after a backup.
# Do not put these rules in the CRM subdomain's document root.
# Redirect rules must precede existing rewrites. Assumes Apache terminates HTTPS.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTP_HOST} ^www\.pxlgrid\.design$ [NC,OR]
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP_HOST} ^(?:www\.)?pxlgrid\.design$ [NC]
  RewriteRule ^ https://pxlgrid.design%{REQUEST_URI} [R=301,L,NE]

  # Only redirect an explicitly requested index.html, not internal DirectoryIndex.
  RewriteCond %{THE_REQUEST} \s/+(.*/)?index\.html(?:[?\s]) [NC]
  RewriteRule ^(.*/)?index\.html$ https://pxlgrid.design/$1 [R=301,L,NE]

  # Only the confirmed retired test URL; never the Portfolio demos.
  RewriteRule ^articles/crm-upload-check-20261001(?:/(?:index\.html)?)?$ - [G,L]
</IfModule>

<IfModule mod_brotli.c>
  AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml
</IfModule>
<IfModule !mod_brotli.c>
  <IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml
  </IfModule>
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "^.+-[A-Za-z0-9_-]{8,}\.(js|css|woff|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.(jpg|jpeg|png|webp|avif|svg)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>
  <FilesMatch "\.(html|xml|txt|json)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
</IfModule>
